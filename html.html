<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acrylic Transparent Shot</title>
  <style>
    :root {
      --bg1: #dff3ff;
      --bg2: #fce2ef;
      --bg3: #e9fbe0;
      --acrylic-fill: rgba(255, 255, 255, 0.18);
      --acrylic-edge: rgba(255, 255, 255, 0.75);
      --shadow: rgba(58, 82, 118, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(70vmax 70vmax at 15% 15%, rgba(255, 255, 255, 0.58), transparent 60%),
        radial-gradient(65vmax 65vmax at 85% 80%, rgba(255, 255, 255, 0.45), transparent 62%),
        linear-gradient(130deg, var(--bg1) 0%, var(--bg2) 48%, var(--bg3) 100%);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .stage {
      position: relative;
      width: min(82vw, 980px);
      aspect-ratio: 16 / 10;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .acrylic {
      position: relative;
      width: min(62vw, 720px);
      aspect-ratio: 4 / 3;
      border-radius: 34px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0.08) 35%, rgba(255, 255, 255, 0.22) 100%),
        var(--acrylic-fill);
      border: 1.4px solid rgba(255, 255, 255, 0.72);
      box-shadow:
        0 26px 55px -12px var(--shadow),
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset -1px -1px 0 rgba(255, 255, 255, 0.35),
        inset 18px 18px 40px rgba(255, 255, 255, 0.2),
        inset -18px -22px 38px rgba(145, 190, 255, 0.13);
      backdrop-filter: blur(15px) saturate(140%);
      -webkit-backdrop-filter: blur(15px) saturate(140%);
      overflow: hidden;
    }

    .acrylic::before,
    .acrylic::after {
      content: "";
      position: absolute;
      pointer-events: none;
    }

    .acrylic::before {
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(90% 58% at 20% 10%, rgba(255, 255, 255, 0.82), transparent 66%),
        radial-gradient(42% 35% at 80% 18%, rgba(192, 223, 255, 0.47), transparent 72%),
        linear-gradient(120deg, rgba(255, 255, 255, 0.2) 10%, rgba(255, 255, 255, 0) 45%, rgba(255, 255, 255, 0.22) 78%);
      mix-blend-mode: screen;
    }

    .acrylic::after {
      inset: 0;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 2px rgba(255, 255, 255, 0.35),
        inset 0 0 45px rgba(255, 255, 255, 0.13);
    }

    .grain {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0.16;
      mix-blend-mode: soft-light;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.55) 0 0.7px, transparent 0.8px),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.42) 0 0.6px, transparent 0.8px);
      background-size: 4px 4px, 5px 5px;
    }

    .edge-glow {
      position: absolute;
      width: min(64vw, 760px);
      aspect-ratio: 4 / 3;
      border-radius: 38px;
      filter: blur(14px);
      z-index: -1;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.65), rgba(152, 217, 255, 0.3));
      opacity: 0.52;
      transform: translateY(5px);
    }

    .spec {
      position: absolute;
      width: 26%;
      aspect-ratio: 1 / 1;
      top: 12%;
      left: 9%;
      border-radius: 50%;
      filter: blur(2px);
      background: radial-gradient(circle, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
      opacity: 0.75;
    }

    .label {
      position: absolute;
      bottom: 6%;
      right: 6%;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(13px, 1.2vw, 16px);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(108, 140, 180, 0.28);
      user-select: none;
    }

    @media (max-width: 700px) {
      .acrylic,
      .edge-glow {
        width: 88vw;
      }

      .stage {
        width: 94vw;
      }

      .acrylic {
        border-radius: 26px;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="edge-glow" aria-hidden="true"></div>
    <div class="acrylic">
      <div class="grain" aria-hidden="true"></div>
      <div class="spec" aria-hidden="true"></div>
      <div class="label">Acrylic Glass</div>
    </div>
  </div>
</body>
</html>
